apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    compileSdk 37
    namespace 'com.haibin.calendarview'
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }
    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 37
        versionCode 371
        versionName "3.7.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled = true
    }
    buildTypes {
        release {
            minifyEnabled false
            consumerProguardFiles 'consumer-rules.pro'
        }
    }
    android {
        lintOptions {
            abortOnError false
        }
    }
    buildFeatures {
        compose true
        viewBinding true
    }
    compileSdkMinor 0
    buildToolsVersion '37.0.0'
    ndkVersion '30.0.14904198 rc1'
    tasks.register('intoJar', Copy) {
        delete 'build/libs/CalendarView.jar'
        from('build/intermediates/bundles/release/')
        into('build/libs/')
        include('classes.jar')
        rename('classes.jar', 'CalendarView.jar')
    }
    intoJar.dependsOn(build)
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    androidTestImplementation('androidx.test.espresso:espresso-core:3.7.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    implementation libs.appcompat
    implementation libs.recyclerview
    implementation 'androidx.compose.foundation:foundation-android:1.13.0-alpha01'
    implementation 'androidx.compose.ui:ui-android:1.13.0-alpha01'
    implementation 'androidx.compose.ui:ui-graphics:1.12.1'
    implementation 'androidx.compose.runtime:runtime-android:1.12.1'
    // ui 1.13.0-alpha01 传递依赖的版本在离线缓存中不存在，显式锁定为可用版本
    implementation 'androidx.lifecycle:lifecycle-runtime-compose-android:2.10.0'
    implementation 'androidx.savedstate:savedstate-compose-android:1.4.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    // 保持 :app 与本模块的传递依赖一致，避免离线解析到不可用版本
    implementation 'androidx.core:core-ktx:1.19.1'
}
